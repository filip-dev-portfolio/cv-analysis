services:

  cv-matcher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cv-matcher

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"

    volumes:
      - ./data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
